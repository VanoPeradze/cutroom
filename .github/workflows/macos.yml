name: macOS validation

on:
  workflow_dispatch:
    inputs:
      transcribe:
        description: Download tiny.en and test real CPU transcription of synthetic English speech
        required: false
        default: true
        type: boolean
      review_release_id:
        description: Optional numeric ID of the unpublished cutroom-review-fe35453 draft release
        required: false
        default: ''
        type: string
      review_transcribe:
        description: For explicit review mode only, allow CI-only tiny.en download and synthetic transcription
        required: false
        default: false
        type: boolean
  push:
    branches: [master]
    paths:
      - '.github/workflows/macos.yml'
      - 'packaging/mac/**'
      - 'packaging/windows/release-baseline.json'
      - 'scripts/**'
      - 'cutroom/**'
      - 'tests/**'
      - 'web/**'
      - 'server.py'
      - 'requirements.txt'
      - 'pytest.ini'
  pull_request:
    paths:
      - '.github/workflows/macos.yml'
      - 'packaging/mac/**'
      - 'packaging/windows/release-baseline.json'
      - 'scripts/**'
      - 'cutroom/**'
      - 'tests/**'
      - 'web/**'
      - 'server.py'
      - 'requirements.txt'
      - 'pytest.ini'

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.review_release_id != '' && 'review' || 'public' }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.review_release_id == '' }}
    name: macOS 15 / ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    # These are standard hosted runners, not the paid -large / -xlarge labels.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CUTROOM_NO_BROWSER: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Isolate regression data in runner temporary storage
        shell: bash
        run: echo "CUTROOM_DATA_DIR=$RUNNER_TEMP/cutroom-regression-data" >> "$GITHUB_ENV"
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install compatible FFmpeg 7 with subtitle support from official Homebrew
        timeout-minutes: 10
        shell: bash
        run: |
          brew install ffmpeg@7
          echo "$(brew --prefix ffmpeg@7)/bin" >> "$GITHUB_PATH"
      - name: Install isolated regression dependencies
        timeout-minutes: 8
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/cutroom-regression-venv"
          "$RUNNER_TEMP/cutroom-regression-venv/bin/python" -m pip install -r tests/requirements.txt -c packaging/mac/constraints-macos.txt
      - name: Run the complete Python regression suite with real FFmpeg
        timeout-minutes: 15
        shell: bash
        run: |
          ffmpeg -version
          "$RUNNER_TEMP/cutroom-regression-venv/bin/python" -m pytest
      - name: Run frontend regressions
        timeout-minutes: 3
        run: node --test tests/frontend*.test.cjs
      - name: Build and verify combined ZIP against the approved Windows baseline
        timeout-minutes: 5
        shell: bash
        run: |
          archive="$(python scripts/build_universal_package.py --download-baseline --output-dir "$RUNNER_TEMP/cutroom-universal")"
          python scripts/build_universal_package.py --verify "$archive"
          echo "CUTROOM_BUILT_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Verify and select the exact pinned candidate archive
        timeout-minutes: 3
        shell: bash
        run: |
          archive="$(python scripts/verify_published_package.py --release packaging/mac/release-candidate.json --output "$RUNNER_TEMP/exact-CUTROOM-candidate.zip")"
          python - "$CUTROOM_BUILT_ARCHIVE" "$archive" <<'PY'
          import hashlib, pathlib, sys, zipfile
          exact = pathlib.Path(sys.argv[2])
          exact.with_suffix(exact.suffix + ".sha256").write_text(hashlib.sha256(exact.read_bytes()).hexdigest() + "  " + exact.name + "\n")
          with zipfile.ZipFile(sys.argv[1]) as built, zipfile.ZipFile(sys.argv[2]) as pinned:
              assert set(built.namelist()) == set(pinned.namelist()), "Candidate inventory differs from reviewed source build"
              for name in built.namelist():
                  # The independently verified combined manifest has build-time metadata.
                  if name != "mac/App/TEST_BUILD.json":
                      assert built.read(name) == pinned.read(name), f"Candidate payload differs: {name}"
          PY
          echo "CUTROOM_CANDIDATE_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Verify audio, mixer and stabilization from the extracted candidate
        timeout-minutes: 6
        shell: bash
        run: |
          "$RUNNER_TEMP/cutroom-regression-venv/bin/python" scripts/check_editor_release.py --archive "$CUTROOM_CANDIDATE_ARCHIVE" --report "$RUNNER_TEMP/editor-features.json"
          python -c 'import json, os, pathlib; print(json.dumps(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"editor-features.json").read_text()), indent=2))' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the pinned previous published release
        timeout-minutes: 3
        shell: bash
        run: |
          archive="$(python scripts/verify_published_package.py --release packaging/mac/validation-baseline.json --windows-baseline packaging/windows/validation-baseline.json --output "$RUNNER_TEMP/previous-published-CUTROOM.zip")"
          echo "CUTROOM_SMOKE_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Test installation, editing, restart and transcription from the previous published release
        timeout-minutes: 18
        shell: bash
        env:
          RUN_TRANSCRIPTION: ${{ (github.event_name != 'workflow_dispatch' || inputs.transcribe) && '1' || '0' }}
        run: |
          extra=()
          if [[ "$RUN_TRANSCRIPTION" == '1' ]]; then extra+=(--transcribe); fi
          python scripts/smoke_macos.py --archive "$CUTROOM_SMOKE_ARCHIVE" --windows-baseline packaging/windows/validation-baseline.json --allow-baseline-restart-failure --report "$RUNNER_TEMP/macos-smoke.json" "${extra[@]}"
          python -c 'import json, os, pathlib; result=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"macos-smoke.json").read_text()); print(json.dumps(result, indent=2))' >> "$GITHUB_STEP_SUMMARY"
      - name: Test missing-pip recovery and the full smoke on the newly built candidate
        timeout-minutes: 18
        shell: bash
        env:
          RUN_TRANSCRIPTION: ${{ (github.event_name != 'workflow_dispatch' || inputs.transcribe) && '1' || '0' }}
        run: |
          extra=()
          if [[ "$RUN_TRANSCRIPTION" == '1' ]]; then extra+=(--transcribe); fi
          python scripts/smoke_macos.py --archive "$CUTROOM_CANDIDATE_ARCHIVE" --repair-missing-pip --report "$RUNNER_TEMP/macos-candidate.json" "${extra[@]}"
          python -c 'import json, os, pathlib; print(json.dumps(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"macos-candidate.json").read_text()), indent=2))' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the tested release archive and native evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CUTROOM-tested-macos-${{ matrix.architecture }}
          path: |
            ${{ env.CUTROOM_CANDIDATE_ARCHIVE }}
            ${{ env.CUTROOM_CANDIDATE_ARCHIVE }}.sha256
            ${{ runner.temp }}/editor-features.json
            ${{ runner.temp }}/macos-smoke.json
            ${{ runner.temp }}/macos-candidate.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  review:
    name: Unpublished candidate / macOS 15 / ${{ matrix.architecture }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.review_release_id != '' }}
    # Draft visibility requires push access. Only the fixed GET transport uses GH_TOKEN.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CUTROOM_NO_BROWSER: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out review orchestration and frozen Git objects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - name: Use canonical runner temporary storage for review checks
        shell: bash
        run: echo "TMPDIR=$(cd "$RUNNER_TEMP" && pwd -P)" >> "$GITHUB_ENV"
      - name: Test review-only provenance, orchestration and transport offline
        timeout-minutes: 3
        run: python -B -X utf8 -m unittest discover -s packaging/tests -p 'test_*review*.py'
      - name: Fetch only the three explicitly pinned unpublished assets
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_RELEASE_ID: ${{ inputs.review_release_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'VanoPeradze/cutroom' ]]
          [[ "$REVIEW_RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          mkdir "$RUNNER_TEMP/review-inputs"
          echo 'Read approved draft metadata by numeric release ID'
          gh api "repos/$GITHUB_REPOSITORY/releases/$REVIEW_RELEASE_ID" > "$RUNNER_TEMP/review-release.json"
          python -B -X utf8 packaging/review_asset_metadata.py \
            --metadata "$RUNNER_TEMP/review-release.json" \
            --record packaging/review-candidates/fe35453.json --repo . \
            --release-id "$REVIEW_RELEASE_ID" > "$RUNNER_TEMP/review-assets.tsv"
          while IFS=$'\t' read -r asset_id asset_name; do
            echo "Read pinned asset ID $asset_id ($asset_name)"
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > "$RUNNER_TEMP/review-inputs/$asset_name"
          done < "$RUNNER_TEMP/review-assets.tsv"
      - name: Qualify exact source and archives before installing dependencies
        timeout-minutes: 3
        shell: bash
        run: |
          python -B -X utf8 packaging/native_review_candidate.py \
            --record packaging/review-candidates/fe35453.json --repo . \
            --windows-zip "$RUNNER_TEMP/review-inputs/CUTROOM-1.2-Beta-Windows-review-fe35453.zip" \
            --combined-zip "$RUNNER_TEMP/review-inputs/CUTROOM-1.2-Beta-combined-review-fe35453.zip" \
            --source-archive "$RUNNER_TEMP/review-inputs/SOURCE-fe35453.zip" \
            --output-dir "$RUNNER_TEMP/review-preflight"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install compatible FFmpeg 7 with subtitle support from official Homebrew
        timeout-minutes: 10
        shell: bash
        run: |
          brew install ffmpeg@7
          echo "$(brew --prefix ffmpeg@7)/bin" >> "$GITHUB_PATH"
      - name: Install isolated feature-test dependencies
        timeout-minutes: 8
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/cutroom-review-venv"
          "$RUNNER_TEMP/cutroom-review-venv/bin/python" -m pip install -r tests/requirements.txt -c packaging/mac/constraints-macos.txt
      - name: Run unchanged strict feature and native installation gates on the exact candidate
        timeout-minutes: 40
        shell: bash
        env:
          REVIEW_TRANSCRIBE: ${{ inputs.review_transcribe && '1' || '0' }}
          CUTROOM_DATA_DIR: ${{ runner.temp }}/cutroom-review-data
        run: |
          extra=()
          if [[ "$REVIEW_TRANSCRIBE" == '1' ]]; then extra+=(--transcribe); fi
          "$RUNNER_TEMP/cutroom-review-venv/bin/python" -B -X utf8 packaging/native_review_candidate.py \
            --record packaging/review-candidates/fe35453.json --repo . \
            --windows-zip "$RUNNER_TEMP/review-inputs/CUTROOM-1.2-Beta-Windows-review-fe35453.zip" \
            --combined-zip "$RUNNER_TEMP/review-inputs/CUTROOM-1.2-Beta-combined-review-fe35453.zip" \
            --source-archive "$RUNNER_TEMP/review-inputs/SOURCE-fe35453.zip" \
            --output-dir "$RUNNER_TEMP/review-reports" --native "${extra[@]}"
      - name: Retain private-review JSON evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CUTROOM-unpublished-review-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/review-preflight/*.json
            ${{ runner.temp }}/review-reports/*.json
          if-no-files-found: warn
          retention-days: 7
