name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Docs, frontend and website helper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Check repository presentation
        run: python scripts/check_repository.py
      - name: Run frontend regressions
        run: node --test tests/frontend*.test.cjs
      - name: Check website JavaScript
        run: node --check website/public/site.js
      - name: Prepare and verify canonical website assets offline
        run: |
          npm --prefix website run prepare:assets
          npm --prefix website run check:assets
      - name: Test website and approved-download validation
        run: npm --prefix website test
