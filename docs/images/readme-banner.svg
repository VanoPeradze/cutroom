<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">CUTROOM — Your footage. Your final cut.</title>
  <desc id="desc">CUTROOM banner in the studio design: the cyan and violet mark, the headline, and an abstract editor with a preview, a playhead and colored timeline tracks.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121a20"/><stop offset="1" stop-color="#151d26"/></linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1bd9ce"/><stop offset="1" stop-color="#a38bd0"/></linearGradient>
    <radialGradient id="glow" cx=".18" cy=".1" r=".7"><stop stop-color="#1bd9ce" stop-opacity=".14"/><stop offset="1" stop-color="#1bd9ce" stop-opacity="0"/></radialGradient>
    <radialGradient id="scene" cx=".3" cy=".3" r=".8"><stop stop-color="#e6b07c" stop-opacity=".55"/><stop offset=".55" stop-color="#3a4852"/><stop offset="1" stop-color="#1b252c"/></radialGradient>
    <clipPath id="frame"><rect x="0" y="0" width="420" height="170" rx="8"/></clipPath>
  </defs>
  <rect width="1200" height="340" rx="20" fill="url(#backdrop)"/>
  <rect width="1200" height="340" rx="20" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="339" rx="19.5" fill="none" stroke="#2b3740"/>

  <path d="M66 44h17L71 92H54z" fill="#1bd9ce"/>
  <path d="M93 44h17L98 92H81z" fill="#a38bd0"/>
  <text x="126" y="80" fill="#edf2f5" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="3">CUTROOM</text>
  <text x="54" y="166" fill="#edf2f5" font-family="Segoe UI,Arial,sans-serif" font-size="56" font-weight="700" letter-spacing="-1.5">Your footage.</text>
  <text x="54" y="230" fill="url(#headline)" font-family="Segoe UI,Arial,sans-serif" font-size="56" font-weight="700" letter-spacing="-1.5">Your final cut.</text>
  <text x="56" y="284" fill="#bfcbd3" font-family="Segoe UI,Arial,sans-serif" font-size="18">Free, local-first video editing for creators.</text>

  <g transform="translate(700 40)">
    <rect x="-14" y="-12" width="474" height="284" rx="14" fill="#1a242b" stroke="#2b3740"/>
    <g clip-path="url(#frame)" transform="translate(13 0)">
      <rect width="420" height="170" fill="url(#scene)"/>
      <path d="M70 0v170M150 0v170M230 0v170M310 0v170" stroke="#ffffff" stroke-opacity=".05" stroke-width="3"/>
      <circle cx="210" cy="85" r="24" fill="#0a0e11" fill-opacity=".45" stroke="#ffffff" stroke-opacity=".75" stroke-width="2"/>
      <path d="M203 73l20 12-20 12z" fill="#ffffff"/>
      <rect x="150" y="138" width="120" height="16" rx="4" fill="#0a0e11" fill-opacity=".7"/>
      <rect x="160" y="144" width="100" height="4" rx="2" fill="#ffffff" fill-opacity=".85"/>
    </g>
    <g transform="translate(13 186)">
      <rect width="420" height="14" rx="3" fill="#4a5862" stroke="#6b7c88"/>
      <rect x="0" y="20" width="96" height="12" rx="3" fill="#4a3fa0" stroke="#8a7be8"/>
      <rect x="150" y="20" width="110" height="12" rx="3" fill="#6b5722" stroke="#c9a94a"/>
      <rect x="0" y="38" width="420" height="12" rx="3" fill="#1f6f5c"/>
      <path d="M4 44h412" stroke="#3fd09e" stroke-width="6" stroke-dasharray="2 3"/>
      <rect x="40" y="56" width="300" height="12" rx="3" fill="#25458c"/>
      <path d="M44 62h292" stroke="#86a9ff" stroke-width="5" stroke-dasharray="2 3"/>
      <path d="M232 -10v84" stroke="#1bd9ce" stroke-width="2"/>
      <path d="M226 -14h12l-6 7z" fill="#1bd9ce"/>
    </g>
  </g>
</svg>
